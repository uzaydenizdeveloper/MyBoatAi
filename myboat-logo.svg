    <line x1="50" y1="38" x2="50" y2="79" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
    <line x1="33" y1="46" x2="67" y2="46" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
    <circle cx="50" cy="24" r="14" fill="none" stroke="#FFFFFF" stroke-width="6" />
    <circle cx="50" cy="24" r="4.5" fill="#0E2038" />
    <path d="M 23,59 C 23,79 36,84 50,84 C 64,84 77,79 77,59" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
  </g>

