  <style>
    :root {
      --orange: #E8800A;
      --orange-dark: #c46a08;
      --bg: #FAF6EE;
      --card: #ffffff;
      --text: #1a1a1a;
      --muted: #666666;
      --border: #e0d8cc;
      --danger: #c0392b;
      --danger-dark: #96301f;
      --success-color: #2d7a4a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo-link {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text);
    }
    .logo-link svg.logo { height: 36px; width: 126px; flex-shrink: 0; overflow: visible; }
    #lang-select {
      border: 1px solid var(--border);
      background: var(--card);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      outline: none;
    }
    main {
      flex: 1;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 20px;
    }
    .card {
      background: var(--card);
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 32px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 24px; line-height: 1.5; }
    .btn {
      display: block;
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      text-align: center;
    }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-google {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .btn-google:hover:not(:disabled) { background: #f5f0e8; }
    .btn-primary { background: var(--orange); color: white; }
    .btn-primary:hover:not(:disabled) { background: var(--orange-dark); }
    .btn-danger { background: var(--danger); color: white; margin-top: 20px; }
    .btn-danger:hover:not(:disabled) { background: var(--danger-dark); }
    .btn-outline {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      display: block;
      width: 100%;
      padding: 11px;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
    }
    .btn-outline:hover { background: var(--bg); }
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 16px 0;
      color: var(--muted);
      font-size: 13px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .form-group { margin-bottom: 14px; }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--muted);
    }
    input[type="email"], input[type="password"], textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      background: var(--bg);
      color: var(--text);
    }
    input:focus, textarea:focus { border-color: var(--orange); }
    textarea { resize: vertical; min-height: 80px; }
    .link-btn {
      background: none;
      border: none;
      color: var(--orange);
      font-size: 14px;
      cursor: pointer;
      padding: 0;
      text-decoration: underline;
      display: block;
      margin: 14px auto 0;
      text-align: center;
    }
    .sign-out-link {
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      display: block;
      margin-top: 12px;
      cursor: pointer;
      background: none;
      border: none;
    }
    .sign-out-link:hover { color: var(--text); text-decoration: underline; }
    .info-box {
      background: #f5f0e8;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .info-box h3 {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 10px;
    }
    .info-box ul { list-style: none; }
    .info-box ul li {
      font-size: 14px;
      padding: 3px 0;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      line-height: 1.4;
    }
    .info-box ul li::before {
      content: '✕';
      color: var(--danger);
      font-size: 11px;
      margin-top: 3px;
      flex-shrink: 0;
      font-weight: 700;
    }
    .info-box.keep ul li::before {
      content: '✓';
      color: var(--success-color);
    }
    .user-email {
      font-size: 14px;
      color: var(--muted);
      text-align: center;
      margin-bottom: 20px;
    }
    .user-email strong {
      color: var(--text);
      display: block;
      font-size: 15px;
      margin-top: 4px;
    }
    .error-msg {
      color: var(--danger);
      font-size: 13px;
      margin-top: 10px;
      display: none;
      text-align: center;
    }
    .success-msg {
      color: var(--success-color);
      font-size: 16px;
      text-align: center;
      padding: 24px 0 8px;
      font-weight: 600;
    }
    .notice-text {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      margin-top: 14px;
      line-height: 1.5;
    }
    .back-btn {
      background: none;
      border: none;
      color: var(--orange);
      font-size: 14px;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 20px;
      text-decoration: underline;
    }
    /* Confirm overlay */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .overlay.active { display: flex; }
    .dialog {
      background: var(--card);
      border-radius: 16px;
      padding: 28px;
      max-width: 380px;
      width: 100%;
    }
    .dialog h2 { font-size: 18px; font-weight: 700; margin-bottom: 10px; }
    .dialog p { font-size: 14px; color: var(--muted); margin-bottom: 20px; line-height: 1.5; }
    .dialog-actions { display: flex; flex-direction: column; gap: 10px; }
    .hidden { display: none !important; }
    footer {
      text-align: center;
      padding: 24px 20px;
      font-size: 13px;
      color: var(--muted);
    }
    .footer-links {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    footer a { color: var(--orange); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
    .google-icon { width: 18px; height: 18px; flex-shrink: 0; }
  </style>
</head>

      <div id="uv-error" class="error-msg"></div>
      <p class="notice-text" id="uv-notice"></p>
    </div>

    <!-- Success view -->
    <div id="view-success" class="hidden">

    </div>

  </div>
</main>

  // ─── LANGUAGE ────────────────────────────────────────────────────────────────
  const $ = id => document.getElementById(id);

  let lang = (() => {
    const nav = (navigator.language || 'en').split('-')[0];
    return T[nav] ? nav : 'en';
  })();

  function t(key) { return (T[lang] && T[lang][key] !== undefined) ? T[lang][key] : T.en[key]; }

  function fillList(ulId, items) {
    const ul = $(ulId);
    ul.innerHTML = '';
    items.forEach(item => {
      const li = document.createElement('li');
      li.textContent = item;
      ul.appendChild(li);
    });
  }

  function applyTranslations() {
    document.documentElement.lang = lang;
    document.title = t('title');
    // sign-out view
    $('so-heading').textContent         = t('heading');
    $('so-subtitle').textContent        = t('subtitle');
    $('so-google-label').textContent    = t('google');
    $('so-or').textContent              = t('or');
    $('so-email-label').textContent     = t('email');
    $('so-password-label').textContent  = t('password');
    $('so-signin-btn').textContent      = t('signIn');
    $('btn-cant-signin').textContent    = t('cantSignIn');
    // signed-in view
    $('si-heading').textContent         = t('heading');
    $('si-signed-as').textContent       = t('signedInAs');
    $('si-will-delete').textContent     = t('willDelete');
    $('si-will-keep').textContent       = t('willKeep');
    $('btn-delete').textContent         = t('deleteBtn');
    $('btn-signout').textContent        = t('signOut');
    fillList('si-delete-list', t('deleteItems'));
    fillList('si-keep-list',   t('keepItems'));
    // unverified view
    $('btn-back').textContent           = t('back');
    $('uv-title').textContent           = t('uvTitle');
    $('uv-subtitle').textContent        = t('uvSubtitle');
    $('uv-email-label').textContent     = t('uvEmail');
    $('uv-notes-label').textContent     = t('uvNotes');
    $('uv-submit-btn').textContent      = t('uvSubmit');
    $('uv-notice').textContent          = t('uvNotice');
    // dialog
    $('dlg-title').textContent          = t('confirmTitle');
    $('dlg-text').textContent           = t('confirmText');
    $('dlg-password-label').textContent = t('confirmPassword');
    $('btn-confirm-delete').textContent = t('confirm');
    $('btn-cancel-delete').textContent  = t('cancel');
    // footer
    $('link-privacy').textContent       = t('privacy');
    $('link-terms').textContent         = t('terms');
    $('link-safety').textContent        = t('safety');
    $('footer-copyright').textContent   = t('copyright');
  }

  $('lang-select').value = lang;
  $('lang-select').addEventListener('change', e => { lang = e.target.value; applyTranslations(); });
  applyTranslations();

  // ─── VIEW HELPERS ────────────────────────────────────────────────────────────
  const views = ['view-signout', 'view-signed-in', 'view-unverified', 'view-success'];
  function showView(id) { views.forEach(v => $(v).classList.toggle('hidden', v !== id)); }

  function showError(id, msg) {
    const el = $(id);
    el.textContent = msg;
    el.style.display = 'block';
  }
  function hideError(id) { $(id).style.display = 'none'; }

  // ─── STATE ───────────────────────────────────────────────────────────────────
  let currentUser  = null;
  let isGoogleUser = false;

  // ─── AUTH STATE ──────────────────────────────────────────────────────────────
  onAuthStateChanged(auth, user => {
    currentUser = user;
    if (user) {
      isGoogleUser = user.providerData.some(p => p.providerId === 'google.com');
      $('si-user-email').textContent = user.email || user.displayName || '';
      showView('view-signed-in');
    } else {
      showView('view-signout');
    }
  });

  // ─── GOOGLE SIGN-IN ──────────────────────────────────────────────────────────
  $('btn-google').addEventListener('click', async () => {
    hideError('signin-error');
    $('btn-google').disabled = true;
    try {
      await signInWithPopup(auth, googleProvider);
    } catch (e) {
      if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') {
        showError('signin-error', t('errSignIn'));
      }
    } finally {
      $('btn-google').disabled = false;
    }
  });

  // ─── EMAIL SIGN-IN ───────────────────────────────────────────────────────────
  $('form-signin').addEventListener('submit', async e => {
    e.preventDefault();
    hideError('signin-error');
    const email    = $('input-email').value.trim();
    const password = $('input-password').value;
    if (!email || !password) return;
    $('so-signin-btn').disabled = true;
    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch {
      showError('signin-error', t('errSignIn'));
    } finally {
      $('so-signin-btn').disabled = false;
    }
  });

  // ─── SIGN OUT ────────────────────────────────────────────────────────────────
  $('btn-signout').addEventListener('click', () => signOut(auth));

  // ─── SHOW / HIDE UNVERIFIED ──────────────────────────────────────────────────
  $('btn-cant-signin').addEventListener('click', () => showView('view-unverified'));
  $('btn-back').addEventListener('click',        () => showView('view-signout'));

  // ─── OPEN CONFIRM DIALOG ─────────────────────────────────────────────────────
  $('btn-delete').addEventListener('click', () => {
    $('dlg-reauth-wrap').classList.toggle('hidden', isGoogleUser);
    $('input-confirm-pw').value = '';
    hideError('dlg-error');
    $('confirm-overlay').classList.add('active');
  });

  function closeDialog() { $('confirm-overlay').classList.remove('active'); }
  $('btn-cancel-delete').addEventListener('click', closeDialog);
  $('confirm-overlay').addEventListener('click', e => { if (e.target === $('confirm-overlay')) closeDialog(); });

  // ─── DELETE ACCOUNT ──────────────────────────────────────────────────────────
  $('btn-confirm-delete').addEventListener('click', async () => {
    hideError('dlg-error');
    $('btn-confirm-delete').disabled = true;
    try {
      const user = auth.currentUser;
      if (!user) throw new Error('no-user');

      // Re-authenticate
      if (isGoogleUser) {
        await reauthenticateWithPopup(user, googleProvider);
      } else {
        const pw = $('input-confirm-pw').value;
        if (!pw) {
          showError('dlg-error', t('confirmPassword').replace(':', ''));
          return;
        }
        const cred = EmailAuthProvider.credential(user.email, pw);
        await reauthenticateWithCredential(user, cred);
      }

      // Delete Firestore user document (subcollections like consentHistory remain)
      try { await deleteDoc(doc(db, 'users', user.uid)); } catch { /* continue */ }

      // Delete Firebase Auth account
      await deleteUser(user);

      closeDialog();
      $('success-text').textContent = t('successDelete');
      showView('view-success');

    } catch (e) {
      if (e.code !== 'auth/popup-closed-by-user') {
        showError('dlg-error', t('errDelete'));
      }
    } finally {
      $('btn-confirm-delete').disabled = false;
    }
  });

  // ─── UNVERIFIED REQUEST ──────────────────────────────────────────────────────
  $('form-unverified').addEventListener('submit', async e => {
    e.preventDefault();
    hideError('uv-error');
    const email = $('input-uv-email').value.trim();
    const notes = $('input-uv-notes').value.trim();
    if (!email) return;
    $('uv-submit-btn').disabled = true;
    try {
      await addDoc(collection(db, 'deletionRequests'), {
        email,
        notes:       notes || null,
        requestedAt: serverTimestamp(),
        lang
      });
      $('success-text').textContent = t('successRequest');
      showView('view-success');
    } catch {
      showError('uv-error', t('errRequest'));
    } finally {
      $('uv-submit-btn').disabled = false;
    }
  });
</script>
